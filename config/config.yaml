defaults:
  - override hydra/job_logging: custom
  - _self_

# Speech recording parameters
starting_phrase: Hej, så jeg klar. Sig 'Hey Jarvis' for at starte.
num_seconds_per_chunk: 0.08
vad_mode: 2
noise_floor_initial: 300.0
noise_floor_min: 40.0
noise_floor_max: 8000.0
noise_floor_rise_rate: 0.08
noise_floor_fall_rate: 0.01
speech_start_snr: 2.5
speech_end_snr: 1.4
onset_frames: 2
pre_roll_seconds: 0.16
max_seconds_silence: 0.8
post_wake_max_seconds: 2.0
max_seconds_audio: 10.0
follow_up_max_seconds: 5.0
barge_in_confirmation_seconds: 0.16
barge_in_speech_start_snr: 2.0
barge_in_echo_delay_ms: 80
play_back_audio: false

# Wake word detection parameters
wake_word_probability_threshold: 0.45
wake_word_responses:
  - Ja?
  - Hvad så?
  - Halløjsa
  - Halløj
  - Davs
  - Hej med dig
  - Hejsa
  - Halløjhalløj
wake_word_seconds: 1.0

# Speech parameters
syv_server: https://platform.syv.ai/v1
asr_model_id: syv-transcribe
asr_language: da
tts_model_id: syvai/plapre-nano
tts_voice: tor
tts_sample_rate: 24000
weather_default_location: ""

# Text engine parameters
text_server: https://api.melious.ai/v1
text_model_id: deepseek-v4-flash-0731
temperature: 0.6
min_prompt_length: 5
system_prompt: >
  Your name is Jarvis and you are a Danish voice robot. You are sweet, kind and helpful,
  and your answers are always very short and to the point. You never use lists. You
  always answer in Danish. You never use emojis.

  You will get a transcription of what the user said, so there will usually be spelling
  and grammar mistakes. You should try to understand what the user meant, and just
  pretend that that's what they said.

  If a tool is potentially relevant to the user's query, you should always call it. If
  the user indicates that they are done talking or wants you to stop, respond with
  exactly [[END_CONVERSATION]] as the very first output and nothing else.

  Today is {weekday}, {month} {day} {year} and the time is {time} (in 24-hour
  format), but you don't need to say that.
# Model-visible tools. Every argument is required; nullable fields represent optional input.
tools:
  - type: function
    strict: true
    name: set_timer
    description: Create a uniquely named local timer.
    parameters:
      type: object
      additionalProperties: false
      properties:
        name: {type: string}
        duration_seconds: {type: integer, minimum: 1, maximum: 86400}
      required: [name, duration_seconds]
  - type: function
    strict: true
    name: list_timers
    description: List active timers, optionally matching one name.
    parameters:
      type: object
      additionalProperties: false
      properties:
        name: {type: [string, 'null']}
      required: [name]
  - type: function
    strict: true
    name: stop_timer
    description: Stop exactly one named timer.
    parameters:
      type: object
      additionalProperties: false
      properties:
        name: {type: string}
      required: [name]
  - type: function
    strict: true
    name: create_reminder
    description: Create a persistent reminder.
    parameters:
      type: object
      additionalProperties: false
      properties:
        profile_name: {type: [string, 'null']}
        name: {type: [string, 'null']}
        message: {type: string}
        delay_seconds: {type: [integer, 'null'], minimum: 1}
        due_at: {type: [string, 'null'], format: date-time}
      required: [profile_name, name, message, delay_seconds, due_at]
      oneOf:
        - additionalProperties: true
          properties:
            delay_seconds: {type: integer, minimum: 1}
            due_at: {type: 'null'}
        - additionalProperties: true
          properties:
            delay_seconds: {type: 'null'}
            due_at: {type: string, format: date-time}
  - type: function
    strict: true
    name: list_reminders
    description: List reminders in a bounded interval.
    parameters:
      type: object
      additionalProperties: false
      properties:
        profile_name: {type: [string, 'null']}
        starts_at: {type: [string, 'null'], format: date-time}
        ends_at: {type: [string, 'null'], format: date-time}
        status: {type: string, enum: [pending, delivered, missed, all]}
      required: [profile_name, starts_at, ends_at, status]
  - type: function
    strict: true
    name: cancel_reminder
    description: Cancel one reminder by name.
    parameters:
      type: object
      additionalProperties: false
      properties:
        profile_name: {type: [string, 'null']}
        reminder_name: {type: string}
      required: [profile_name, reminder_name]
  - type: function
    strict: true
    name: list_calendar_events
    description: List chronological calendar events.
    parameters:
      type: object
      additionalProperties: false
      properties:
        profile_name: {type: [string, 'null']}
        calendar_name: {type: [string, 'null']}
        starts_at: {type: string, format: date-time}
        ends_at: {type: string, format: date-time}
        query: {type: [string, 'null']}
        max_results: {type: integer, minimum: 1, maximum: 50}
      required: [profile_name, calendar_name, starts_at, ends_at, query, max_results]
  - type: function
    strict: true
    name: get_calendar_availability
    description: Get busy calendar intervals without event details.
    parameters:
      type: object
      additionalProperties: false
      properties:
        profile_names:
          type: array
          items: {type: string}
        starts_at: {type: string, format: date-time}
        ends_at: {type: string, format: date-time}
      required: [profile_names, starts_at, ends_at]
  - type: function
    strict: true
    name: spotify_play
    description: Search and start one Spotify item.
    parameters:
      type: object
      additionalProperties: false
      properties:
        profile_name: {type: [string, 'null']}
        query: {type: string}
        media_type: {type: [string, 'null'], enum: [track, album, artist, playlist, show, episode, null]}
        device_name: {type: [string, 'null']}
      required: [profile_name, query, media_type, device_name]
  - type: function
    strict: true
    name: spotify_control
    description: Control current Spotify playback.
    parameters:
      type: object
      additionalProperties: false
      properties:
        profile_name: {type: [string, 'null']}
        action: {type: string, enum: [pause, resume, next, previous]}
        device_name: {type: [string, 'null']}
      required: [profile_name, action, device_name]
  - type: function
    strict: true
    name: spotify_set_volume
    description: Set the volume on one Spotify device.
    parameters:
      type: object
      additionalProperties: false
      properties:
        profile_name: {type: [string, 'null']}
        volume_percent: {type: integer, minimum: 0, maximum: 100}
        device_name: {type: [string, 'null']}
      required: [profile_name, volume_percent, device_name]
  - type: function
    strict: true
    name: spotify_now_playing
    description: Return the current Spotify item and playback state.
    parameters:
      type: object
      additionalProperties: false
      properties:
        profile_name: {type: [string, 'null']}
      required: [profile_name]
  - type: function
    strict: true
    name: spotify_list_devices
    description: List available Spotify device aliases.
    parameters:
      type: object
      additionalProperties: false
      properties:
        profile_name: {type: [string, 'null']}
      required: [profile_name]
  - type: function
    strict: true
    name: list_shopping_lists
    description: List configured shopping-list aliases.
    parameters:
      type: object
      additionalProperties: false
      properties:
        profile_name: {type: [string, 'null']}
      required: [profile_name]
  - type: function
    strict: true
    name: get_shopping_list
    description: Return a bounded shopping list.
    parameters:
      type: object
      additionalProperties: false
      properties:
        profile_name: {type: [string, 'null']}
        list_name: {type: [string, 'null']}
        include_checked: {type: boolean}
      required: [profile_name, list_name, include_checked]
  - type: function
    strict: true
    name: add_shopping_items
    description: Add one or more shopping items.
    parameters:
      type: object
      additionalProperties: false
      properties:
        profile_name: {type: [string, 'null']}
        list_name: {type: [string, 'null']}
        items:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            properties:
              name: {type: string}
              amount: {type: [number, 'null']}
              unit: {type: [string, 'null']}
            required: [name, amount, unit]
      required: [profile_name, list_name, items]
  - type: function
    strict: true
    name: set_shopping_item_checked
    description: Mark exactly one shopping item as bought or not bought.
    parameters:
      type: object
      additionalProperties: false
      properties:
        profile_name: {type: [string, 'null']}
        list_name: {type: [string, 'null']}
        item_name: {type: string}
        checked: {type: boolean}
      required: [profile_name, list_name, item_name, checked]
  - type: function
    strict: true
    name: remove_shopping_item
    description: Remove exactly one shopping item after confirmation.
    parameters:
      type: object
      additionalProperties: false
      properties:
        profile_name: {type: [string, 'null']}
        list_name: {type: [string, 'null']}
        item_name: {type: string}
      required: [profile_name, list_name, item_name]
  - type: function
    strict: true
    name: get_weather
    description: Get the current weather for a location.
    parameters:
      type: object
      additionalProperties: false
      properties:
        location: {type: string}
      required: [location]
  - type: function
    strict: true
    name: get_news
    description: Read the latest news.
    parameters:
      type: object
      additionalProperties: false
      properties: {}
      required: []
  - type: function
    strict: true
    name: search_web
    description: Search the web for information.
    parameters:
      type: object
      additionalProperties: false
      properties:
        keywords: {type: string}
      required: [keywords]
  - type: function
    strict: true
    name: meow
    description: Make a cat sound.
    parameters:
      type: object
      additionalProperties: false
      properties: {}
      required: []

# Local routing configuration contains no credentials.
mutations_enabled: true
locale: da-DK
timezone: Europe/Copenhagen
device:
  id: kitchen-speaker
  default_profile: dan
# Spoken aliases and provider object bindings are local metadata only. Provider IDs
# are optional setup output and are never accepted from model tool arguments.
profiles:
  dan:
    aliases: [Dan, mig]
profile_aliases: {}
calendar_aliases: {}
# Deprecated aliases remain accepted only under device.default_profile.
spotify_device_aliases: {}
shopping_list_aliases: {}
storage:
  database_path: .local/state/voicebot.sqlite
  credential_backend: keyring
  master_key_env: VOICEBOT_MASTER_KEY
integrations:
  google_calendar:
    enabled: true
    backend: gws
    calendar_aliases:
      dan:
        min kalender: primary
  spotify:
    enabled: false
    default_profile: dan
    # Device aliases are profile-scoped to prevent cross-account routing.
    device_aliases: {}
  listonic:
    enabled: false
    allow_unofficial: false
    allow_unverified_item_removal: false
    list_aliases: {}
    # Required per profile when a shopping tool omits list_name.
    default_lists: {}
scheduler:
  poll_seconds: 1
  lease_seconds: 30
  missed_grace_seconds: 900

# Parameters for all text outputs - these are specific to the ASR and text engine models
manual_fixes:
  hvor den: hvordan
  solig: solrig
  bliver er: bliver

  er været: er vejret
  erværet: er vejret
  blev været: bliver vejret
  blevr været: bliver vejret
  bliver været: bliver vejret

  er varet: er vejret
  ervaret: er vejret
  blev varet: bliver vejret
  bliver varet: bliver vejret

  er vævet: er vejret
  ervævet: er vejret
  blev vævet: bliver vejret
  bliver vævet: bliver vejret

  er være: er vejret
  ervære: er vejret
  blev være: bliver vejret
  bliver være: bliver vejret

  er erhvervet: er vejret
  ervhervet: er vejret
  blev erhvervet: bliver vejret
  bliver erhvervet: bliver vejret

  er erhveret: er vejret
  ervheret: er vejret
  blev erhveret: bliver vejret
  bliver erhveret: bliver vejret
