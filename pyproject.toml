[project]
name = "voicebot"
version = "0.0.0"
description = "A simple Danish voice bot."
readme = "README.md"
authors = [
    {name = "Dan Saattrup Smart", email = "saattrupdan@gmail.com"},
]
maintainers = [
    {name = "Dan Saattrup Smart", email = "saattrupdan@gmail.com"},
]
requires-python = ">=3.14,<3.15"
dependencies = [
  "hydra-core>=1.3.6",
  "openai>=3.13.0",
  "python-dotenv>=1.2.3",
  "sounddevice>=0.5.6",
  "pvrecorder>=1.2.7",
  "openmeteo-requests>=1.7.5",
  "requests-cache>=1.3.3",
  "retry-requests>=2.0.0",
  "numpy>=2.5.3",
  "omegaconf>=2.3.1",
  "onnxruntime>=1.30.0",
  "pydantic>=2.13.5",
  "requests>=2.34.2",
  "openwakeword @ git+https://github.com/saattrupdan/openWakeWord.git@7e278890973591734c3ac7f4f65110e4a945ab38",
  "chime>=0.8.0",
  "webscout==2026.6.14",
  "playsound3>=3.3.2",
  "httpx>=0.28.1",
  "webrtcvad-wheels==2.0.14",
]

[project.urls]
Repository = "https://github.com/saattrupdan/voicebot"
Issues = "https://github.com/saattrupdan/voicebot/issues"

[project.license]
text = "MIT"

[dependency-groups]
dev = [
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "pre-commit>=4.6.2",
  "pdoc>=16.0.0",
  "readme-coverage-badger>=1.1.0",
  "click>=8.5.0",
  "ruff>=0.16.7",
  "pyrefly>=1.3.0",
  "nbstripout>=0.9.1",
]

[tool.uv]
no-binary-package = ["webscout"]

[tool.ruff]
target-version = "py314"
line-length = 88
exclude = [
    ".git",
    ".pytest_cache",
    ".ruff_cache",
    ".euroeval_cache",
    ".venv",
]
extend-include = [
    "*.ipynb",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
skip-magic-trailing-comma = true

[tool.ruff.lint]
select = [
    # isort (imports)
    "I",
    # pydocstyle (docstrings)
    "D",
    # pycodestyle errors and warnings (PEP8)
    "E",
    "W",
    # flake-annotations (type hints)
    "ANN",
    # Pyflakes
    "F",
]
ignore = [
    # Type annotations for "self" arguments
    "ANN101",
    # Type annotations for "cls" arguments
    "ANN102",
    # Type annotations for *args
    "ANN002",
    # Type annotations for **kwargs
    "ANN003",
    # Docstrings for **kwargs
    "D417",
]

[tool.ruff.lint.extend-per-file-ignores]
"__init__.py" = [
    "F401",
]
"src/scripts/main.py" = [
    "I",
]

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "--cov=src/voicebot",
    "--color=yes",
    "-vvv",
]
xfail_strict = true
filterwarnings = [
    "error",
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::ImportWarning",
    "ignore::ResourceWarning",
    "ignore::FutureWarning",
]
log_cli_level = "INFO"
testpaths = [
    "tests",
]
pythonpath = [
    "src",
    "src/scripts",
]

[tool.pyrefly]
site-package-path = [".venv/lib/python3.14/site-packages"]

[tool.hatch.metadata]
allow-direct-references = true

[build-system]
requires = ["hatchling>=1.32.0"]
build-backend = "hatchling.build"
